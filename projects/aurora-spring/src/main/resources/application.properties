spring.application.name=aurora

# file-based H2 database, in the data/ folder
spring.datasource.url=jdbc:h2:file:./data/aurora
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

# one request, one virtual thread (Section 39.7)
spring.threads.virtual.enabled=true

# Actuator: which management endpoints to expose
management.endpoints.web.exposure.include=health,info,metrics
