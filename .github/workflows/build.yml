name: build

on:
  push:
  pull_request:

jobs:
  projects:
    name: Maven projects (chapters 45-47)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        run: mvn -B verify

  examples:
    name: Chapter examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile every example
        run: ./tools/compile-examples.sh

  spring:
    name: Spring Boot project (chapter 46)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/aurora-spring
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        run: ./mvnw -B verify
